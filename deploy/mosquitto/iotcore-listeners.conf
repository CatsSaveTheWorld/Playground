per_listener_settings true

# Existing IoTCore applications on the same server.
listener 1883 127.0.0.1
allow_anonymous true

# Authenticated device agents on the home LAN.
listener 1884 192.168.0.8
allow_anonymous false
password_file /etc/mosquitto/iotcore-agent-passwords
acl_file /etc/mosquitto/iotcore-agent-acl
